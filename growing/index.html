;justify-content:center;margin:8px auto 15px}.mini{position:relative;width:52px;height:55px;background:#392747;border:1px solid #715681;border-radius:10px;display:grid;place-items:center}.mini img{width:45px;height:45px;object-fit:contain}.mini b{position:absolute;bottom:0;right:2px;background:#211629;border:1px solid var(--pink);border-radius:6px;font-size:10px;padding:0 4px;color:#fff}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tool{display:flex;align-items:center;gap:8px;justify-content:center}.tool em{font-size:23px;font-style:normal}.tool small{font-size:12px}.tool b{color:var(--lime)}.item{display:flex;align-items:center;justify-content:space-between;gap:9px;background:#352640;border:1px solid #735389;padding:13px;border-radius:12px;margin:9px 0}.item strong{color:#ecd1f3}.item small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.item .btn{flex-shrink:0}.notice{border:1px solid #9d7bb2;background:#392747;border-radius:12px;padding:10px;margin:12px 0;color:#e8d2ea}.modal-shade{position:fixed;inset:0;z-index:20;background:#08040ccd;display:grid;place-items:center;padding:14px}.modal{width:min(440px,100%);max-height:86vh;overflow-y:auto;border:2px solid #ad79c1;border-radius:18px;background:linear-gradient(#392747,#23172d);padding:22px 16px;box-shadow:0 0 35px #ae6be34c;text-align:center}.modal h2{color:var(--pink);font-family:Eater,Georgia,serif;font-size:21px}.modal p{font-size:14px;line-height:1.6}.modal .btn{margin:6px}.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.roster div{background:#392747;border-radius:9px;padding:6px;font-size:11px}.roster img{width:100%;aspect-ratio:1;object-fit:contain}.debug{margin-top:20px;border-top:1px solid #6a5278;padding-top:12px}.debug summary{cursor:pointer;font-size:12px;color:#b7a2c1}.debug .btn{font-size:12px;min-height:38px;padding:7px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b9e973;box-shadow:0 0 10px #b9e973;vertical-align:middle;margin-right:5px}.planet{width:170px;height:170px;border-radius:50%;margin:16px auto;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 24%,#67477a,#372740 70%,#22132b);box-shadow:0 0 30px #b66ad64f}.planet:before{content:'';position:absolute;inset:28px -20px;border:2px solid var(--lime);border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 15px #b9e97354;animation:orbit 8s linear infinite}.planet span{position:relative;font:17px Eater,serif;color:var(--pink);text-align:center;text-shadow:0 0 10px #e5a6ff}.warning{color:#f8d7a8}.locked{opacity:.55}.footer{font-size:10px;color:#9f8ba9;text-align:center;margin:20px 0 0}@keyframes mutate{0%,100%{transform:scale(1);text-shadow:0 0 12px #ca68e8}48%{transform:scale(1.03,1.09);text-shadow:0 0 22px #ca68e8,0 3px #6f9a3d}52%{transform:scale(1.005,.98)}55%{transform:scale(1.025,1.08)}}@keyframes orbit{to{transform:rotate(335deg)}}@media(prefers-reduced-motion:reduce){.title,.planet:before{animation:none}}

/* Test 3: make the four-or-more threshold visually undeniable. */
.hex.merge-glow polygon {fill:#53652d;stroke:#d9ff7f;stroke-width:3;filter:drop-shadow(0 0 7px #c6f566)}
.hex.merge-glow image {filter:drop-shadow(0 0 7px #e2ff9a)}
