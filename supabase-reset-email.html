<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 12px;background:#160B0E;color:#fce8ec;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:520px;margin:0 auto;">
    <div style="text-align:center;padding:8px 0 24px;font-size:29px;font-weight:800;letter-spacing:3px;color:#F36B78;">NINE &amp; WEIRD</div>
    <div style="background:#281720;border:1px solid #70434e;border-radius:16px;padding:28px 24px;">
      <h1 style="font-size:23px;line-height:1.3;margin:0 0 20px;color:#fff1f4;">Forgot your password?</h1>
      <p style="font-size:15px;line-height:1.7;margin:0 0 15px;">It happens. Even to people who are suspiciously good at Sudoku.</p>
      <p style="font-size:15px;line-height:1.7;margin:0 0 24px;">Use the button below to set a new password and get back to your puzzles.</p>
      <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#F36B78;color:#260d16;text-decoration:none;font-size:14px;font-weight:800;letter-spacing:1px;padding:15px 22px;border-radius:9px;">RESET MY PASSWORD</a></p>
      <p style="font-size:13px;line-height:1.6;color:#cba8b1;margin:0;">Didn't ask for this? Ignore the email. Your password stays the same.</p>
    </div>
    <p style="text-align:center;color:#c89da8;font-size:12px;margin:20px 0 0;">Nine &amp; Weird Team</p>
  </div>
</body>
