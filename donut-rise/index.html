/* Matte Hot Pink — actual DOM/CSS game styling, not generated concept art. */
:root{--pink:#e65c91;--cream:#fff4ee;--rose:#ed83aa;--dark:#361b33;--border:#b94f7b}
html,body{background:#e790ad!important;color:#fff5ee;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{background:radial-gradient(ellipse at 12% 2%,#f4acc3 0%,transparent 42%),radial-gradient(ellipse at 95% 75%,#da7e9e,transparent 55%),#e48eab!important}
.app{max-width:510px;padding:16px 15px 24px;gap:12px;min-height:100dvh;background:linear-gradient(170deg,#ed9db7 0%,#de86a4 100%);box-shadow:0 0 45px #5c1e4b22}
.topline{gap:8px}.tag{color:#682c4d;font-size:10px;letter-spacing:.08em}.topbuttons button,.smallbutton{border:1px solid #bc6888;background:#f6bdd0;color:#712a4c;border-radius:12px;padding:8px 10px;box-shadow:0 2px 0 #ad5779;font-size:11px}
header{padding:4px 0 5px}header h1{font-size:clamp(33px,9vw,53px);font-weight:700;color:#fff7ed;text-shadow:0 3px 0 #ad517e,0 7px 16px #8a395f44;margin:1px 0 4px;letter-spacing:.045em}
header h1 .punct{color:#75284e}header p{color:#783350;font-size:12px;font-weight:700;letter-spacing:.04em}
.stats{grid-template-columns:1.2fr 1fr 1fr;gap:8px}.stat{background:#f2bbcb;border:1.5px solid #c87997;border-radius:14px;padding:9px 4px;box-shadow:0 3px 0 #ab55796b}.stat label{color:#923d65;font-size:9px}.stat strong{color:#762d50;font-size:20px;font-weight:700}
.boardwrap{padding:11px 10px 9px;border-radius:23px;border:2px solid #ad547d;background:#7b3659;box-shadow:0 7px 0 #ad5d80,0 19px 28px #6f274b34,inset 0 1px 0 #ffbdd2}
.board{gap:3px}.cell{border:1px solid #a36887;border-radius:8px;background:#53263f;transition:background .13s,box-shadow .13s,transform .13s}.cell:nth-child(8n + 1){border-left-color:#a36887}
.cell.occupied,.cell.occupied.alt{background:var(--group-color,#edabc7);border-color:#ffe1e7;box-shadow:inset 0 1px 1px #fff9,0 2px 0 #4a18394d;border-radius:4px;position:relative}
.cell.occupied.group-first{border-radius:9px 2px 2px 9px;border-right-color:transparent}
.cell.occupied.group-middle{border-radius:2px;border-left-color:transparent;border-right-color:transparent}
.cell.occupied.group-last{border-radius:2px 9px 9px 2px;border-left-color:transparent}
.cell.occupied.group-single{border-radius:9px;border-left-color:#ffe1e7;border-right-color:#ffe1e7}
.cell.occupied img{width:100%;height:100%;padding:2px;filter:drop-shadow(0 2px 2px #53263f55)}

/* Restrained game feedback: clean row dissolve and physical piece drops. */
.action{grid-template-columns:repeat(2,minmax(0,1fr))}
.action button{font-size:12px;padding:12px 6px}
.boardwrap{position:relative;overflow:visible}
.board.is-resolving .cell.occupied{cursor:default}
.cell.line-clear{z-index:3!important;background:#f1a6bc!important;border-color:#ffe3ec!important;box-shadow:none!important;animation:cleanRowOut 320ms ease-in both}
.cell.line-clear img,.cell.line-clear .fallback,.cell.line-clear.special:after{animation:cleanDonutOut 320ms ease-in both}
@keyframes cleanRowOut{0%,20%{opacity:1}45%{background:#f5c5d2;opacity:1}100%{opacity:0;transform:scaleY(.25)}}
@keyframes cleanDonutOut{0%,30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.84)}}
/* Soft landing feedback for donuts after falling. The fall itself is WAAPI position interpolation. */
.cell.just-landed{animation:landSettle 150ms ease-out both}
@keyframes landSettle{0%{filter:brightness(1.07)}100%{filter:brightness(1)}}
.clear-points{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:12;white-space:nowrap;color:#fff4ec;background:#7a365c;padding:6px 13px;border:1px solid #e6a2bd;border-radius:10px;font:700 17px Fredoka,system-ui;box-shadow:0 3px 7px #38152e55;pointer-events:none;animation:cleanPoints 850ms ease-out both}
@keyframes cleanPoints{0%{opacity:0;transform:translate(-50%,0)}15%,70%{opacity:1;transform:translate(-50%,-12px)}100%{opacity:0;transform:translate(-50%,-25px)}}
@media(prefers-reduced-motion:reduce){.cell.line-clear,.cell.line-clear img,.cell.just-landed,.clear-points{animation:none!important}}

/* A truly seamless backdrop: one absolutely-positioned rounded panel per donut group.
   Donut hitboxes remain in the original grid, with no folded border bridges. */
.board .cell.occupied,
.board .cell.occupied.alt,
.board .cell.occupied.group-first,
.board .cell.occupied.group-middle,
.board .cell.occupied.group-last,
.board .cell.occupied.group-single,
.board .cell.occupied.selected{
 background:transparent;border:1px solid transparent;border-radius:0;box-shadow:none;outline:none;z-index:1;
}
.board .cell.occupied img{position:relative;z-index:1}
.board .group-tray{
 position:absolute;z-index:0;pointer-events:none;box-sizing:border-box;
 border-radius:13px;background:#744B58;border:1px solid #AF7E8B;
 box-shadow:0 3px 7px #00000032,inset 0 1px 0 #D6A3B035;
}
.board .group-tray.is-selected{
 background:#885767;border-color:#E7BAC9;
 box-shadow:0 4px 10px #00000040,inset 0 1px 0 #E7BAC94D;
}
.board .group-tray.line-clear-tray{animation:cleanRowOut 320ms ease-in both}
@media(prefers-reduced-motion:reduce){.board .group-tray.line-clear-tray{animation:none!important;opacity:0}}

/* Compact Donut Rise controls — only this standalone game page. */
.game-title{padding:3px 0 0}
.game-title h1{font-size:clamp(29px,8vw,48px);margin:1px 0 0;line-height:1.2}
/* Approved Bouncy & Cheeky title: gentle float and playful exclamation pop. */
.game-title h1{display:inline-block;animation:nwDonutTitleFloat 2.8s ease-in-out infinite}
.game-title h1 .punct{display:inline-block;transform-origin:50% 85%;animation:nwDonutTitleBang 2.8s ease-in-out infinite}
@keyframes nwDonutTitleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes nwDonutTitleBang{0%,27%,80%,100%{transform:rotate(0deg) scale(1)}39%{transform:rotate(15deg) scale(1.18)}52%{transform:rotate(-9deg) scale(1.1)}66%{transform:rotate(0deg) scale(1)}}
@media(prefers-reduced-motion:reduce){.game-title h1,.game-title h1 .punct{animation:none!important}}

.quick-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0}

.quick-actions button:focus-visible{outline:2px solid #F6EEE8;outline-offset:2px}
.quick-actions button:disabled{opacity:.6;cursor:not-allowed}
.stats{margin:0}
.boardwrap{margin-top:0}
.message{font-size:12px;min-height:18px;margin:0}
.info-modal{max-width:350px;padding:20px 18px 18px}
.info-modal h2{font-size:26px;margin:0 0 12px}

<script>
(()=>{'use strict';
const COLS=8,ROWS=10,files=['01_pink_sprinkles.png','02_chocolate_crunch.png','03_strawberry_drizzle.png','04_lemon_coconut.png','05_aqua_cookies.png','06_blueberry.png','07_caramel_crunch.png','08_heart_candy.png','09_mint_chocolate.png'];
const art=files.map(f=>'../assets/donuts/'+f);
const $=id=>document.getElementById(id);const board=$('board'),wrap=$('wrap'),message=$('message'),landing=$('drLanding'),gameShell=$('drGameShell');let grid=[],groups=new Map(),nextId=1,score=0,lines=0,moves=0,running=true,paused=false,selected=null,drag=null,hover=null,busy=false;
const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));const empty=()=>Array.from({length:ROWS},()=>Array(COLS).fill(null));
function announce(str){message.textContent=str;}
function groupRow(id){for(let r=0;r<ROWS;r++){let c=grid[r].indexOf(id);if(c>=0)return {r,c};}return null}
// Each donut artwork always represents one block length.
const LENGTH_ART=[[0,1,2],[3,4],[5,6],[7,8]];
function donutForLength(len){const choices=LENGTH_ART[len-1];return choices[rnd(0,choices.length-1)]}
function seedGroup(r,c,len,donut=null,specialAt=-1){let id=nextId++;const kind=donut===null?donutForLength(len):donut;let ds=Array.from({length:len},(_,i)=>({type:kind,special:i===specialAt}));groups.set(id,{len,donuts:ds});for(let j=0;j<len;j++)grid[r][c+j]=id;return id}
function initial(){
 // Two demonstration rows that leave space to practice sideways movement.
 seedGroup(ROWS-2,0,4);seedGroup(ROWS-2,6,2,null,1); // 4-00-2
 seedGroup(ROWS-1,0,1);seedGroup(ROWS-1,3,3);seedGroup(ROWS-1,6,2); // 1-00-3-2
}
function generateRow(){let a=Array(COLS).fill(null),c=0,hasGap=false;while(c<COLS){if(Math.random()<.28){c+=rnd(1,Math.min(3,COLS-c));hasGap=true;continue}let len=rnd(1,Math.min(4,COLS-c));let id=nextId++;const kind=donutForLength(len);let donuts=Array.from({length:len},()=>({type:kind,special:Math.random()<.085}));groups.set(id,{len,donuts});for(let k=0;k<len;k++)a[c+k]=id;c+=len}if(!hasGap){let id=a[COLS-1];if(id!==null){let first=a.indexOf(id);for(let i=first;i<COLS;i++)a[i]=null;groups.delete(id)}}return a}
function cleanGroups(){const alive=new Set(grid.flat().filter(v=>v!==null));for(const id of groups.keys())if(!alive.has(id))groups.delete(id)}
// Whole strips fall under gravity if EVERY square directly beneath the strip is empty.
// They never split into individual donuts, and stop if any column is supported.
function settleGroups(){
 let moved=false,passes=0;
 do{
  moved=false;
  const positions=[];
  for(const id of groups.keys()){
   const p=groupRow(id);if(p)positions.push({id,...p});
  }
  // Bottom-up lets upper groups drop into space freed by lower groups.
  positions.sort((a,b)=>b.r-a.r||a.c-b.c);
  for(const {id} of positions){
   const pos=groupRow(id),g=groups.get(id);
   if(!pos||!g)continue;
   let bottom=pos.r;
   while(bottom<ROWS-1){
    let space=true;
    for(let k=0;k<g.len;k++){
     const other=grid[bottom+1][pos.c+k];
     if(other!==null&&other!==id){space=false;break;}
    }
    if(!space)break;
    bottom++;
   }
   if(bottom!==pos.r){
    for(let k=0;k<g.len;k++){grid[pos.r][pos.c+k]=null;grid[bottom][pos.c+k]=id;}
    moved=true;
   }
  }
  if(moved)cleanGroups();
 }while(moved&&++passes<ROWS*ROWS);
}
const nap=ms=>new Promise(done=>setTimeout(done,ms));
function fullRows(){const rows=[];for(let r=0;r<ROWS;r++)if(grid[r].every(id=>id!==null))rows.push(r);return rows}

 const old=new Map();

}
async function animateBoardMovement(before){
 // Move actual blocks from prior grid positions to their new coordinates.
 // This also handles the physical downshift of rows after a full line disappears.

 const stepX=sample.getBoundingClientRect().width+(parseFloat(style.columnGap)||0);

 const animations=[];
 for(const [id,pos] of before){
  const after=groupRow(id);
  if(!after)continue;
  const dx=(pos.c-after.c)*stepX,dy=(pos.r-after.r)*stepY;
  if(!dx&&!dy)continue;
  const duration=Math.min(680,Math.max(260,260+Math.abs(after.r-pos.r)*78));
  const cells=board.querySelectorAll('.cell[data-id="'+id+'"],.group-tray[data-id="'+id+'"]');
  cells.forEach(el=>{
   el.style.zIndex=el.classList.contains('group-tray')?'4':'5';
   const keyframes=[
    {transform:'translate('+dx+'px,'+dy+'px)'},
    {transform:'translate('+dx*.18+'px,'+dy*.18+'px)',offset:.79},
    {transform:'translate(0px,0px)',offset:1}
   ];
   const animation=el.animate(keyframes,{duration,easing:'cubic-bezier(.34,.01,.28,1)',fill:'both'});
   animations.push(animation.finished.catch(()=>{}));
  });

async function dropWithMotion(){

 await animateBoardMovement(before);
}
async function showLineEffect(rows,combo){
 // Only full rows are allowed to use this animation; nothing else changes.
 render();
 for(const r of rows){
  board.querySelectorAll('.cell[data-r="'+r+'"]').forEach(el=>el.classList.add('line-clear'));
  board.querySelectorAll('.group-tray[data-r="'+r+'"]').forEach(el=>el.classList.add('line-clear-tray'));
 }
 announce(combo===1?'FULL LINE!':'COMBO ×'+combo+'!');

}
async function clearLines(combo=1,full=fullRows()){
 if(!full.length)return 0;
 let specialCount=0;
 // Score only the actual occupied cells of 100%-complete 8-donut rows.
 for(const r of full){for(let c=0;c<COLS;c++){
  const id=grid[r][c],g=groups.get(id),pos=groupRow(id);
  if(g&&pos&&g.donuts[c-pos.c]?.special)specialCount++;
 }}

 const remaining=grid.filter((_,r)=>!full.includes(r));
 grid=Array.from({length:full.length},()=>Array(COLS).fill(null)).concat(remaining);
 const points=(full.length*100+specialCount*50)*combo;
 score+=points;lines+=full.length;cleanGroups();selected=null;
 announce((combo>1?'COMBO ×'+combo+'! ':'')+full.length+' FULL LINE'+(full.length>1?'S':'')+'! +'+points);
 await animateBoardMovement(before);

}
async function resolveBoard(){

function locAtPoint(x,y){const el=document.elementFromPoint(x,y)?.closest('.cell');if(!el||!board.contains(el))return null;return {r:+el.dataset.r,c:+el.dataset.c}}

 // Horizontal slide must be unobstructed along its entire path, not a teleport.
 const direction=c>pos.c?1:-1;
 for(let step=pos.c+direction;direction>0?step<=c:step>=c;step+=direction){
  for(let k=0;k<g.len;k++){
   const cell=grid[r][step+k];
   if(cell!==null&&cell!==id)return false;
  }
 }
 return true;
}
async function replenishEmptyBoard(){
 // When every block has been cleared, introduce exactly one new bottom row.
 // A no-op tap does not trigger this, because only successful moves resolve.
 if(grid.some(row=>row.some(id=>id!==null)))return false;
 grid[ROWS-1]=generateRow();
 cleanGroups();
 render();
 announce('BOARD CLEARED! A NEW ROW ARRIVES');
 await resolveBoard();
 return true;
}
async function move(id,r,c){
 if(!running||paused||busy||!canMove(id,r,c))return false;
 busy=true;wrap.classList.add('is-resolving');
 try{
  const pos=groupRow(id),g=groups.get(id);
  for(let k=0;k<g.len;k++)grid[pos.r][pos.c+k]=null;
  for(let k=0;k<g.len;k++)grid[r][c+k]=id;
  selected=null;hover=null;moves++;
  render();
  await resolveBoard();
  if(running){
   // If the whole board clears, replenish once instead of pushing an extra row.
   const refilled=await replenishEmptyBoard();
   if(!refilled){
    rise();
    // Newly generated bottom rows may complete a line or trigger a cascade.
    if(running)await resolveBoard();
    if(running)await replenishEmptyBoard();
   }
  }
  return true;
 }finally{busy=false;wrap.classList.remove('is-resolving');render()}
}
function reportFrameHeight(){
 // Same-origin parent uses this to size the iframe to the full 10-row board.
 // ResizeObserver tracks font loading, board sizing and help-panel expansion.
 try{
  const height=Math.ceil(Math.max(document.documentElement.scrollHeight,document.body.scrollHeight));
  if(height>0&&window.parent!==window)window.parent.postMessage({type:'nw-donut-rise-height',height},location.origin);
 }catch{}
}
function buildGroupTrays(){
 const trays=document.createDocumentFragment();
 for(const [id,g] of groups){
  const pos=groupRow(id);
  if(!pos)continue;
  const first=board.querySelector('.cell[data-r="'+pos.r+'"][data-c="'+pos.c+'"]');
  const last=board.querySelector('.cell[data-r="'+pos.r+'"][data-c="'+(pos.c+g.len-1)+'"]');
  if(!first||!last)continue;
  const tray=document.createElement('div');
  tray.className='group-tray';
  tray.dataset.id=id;tray.dataset.r=pos.r;
  tray.style.left=first.offsetLeft+'px';
  tray.style.top=first.offsetTop+'px';
  tray.style.width=(last.offsetLeft+last.offsetWidth-first.offsetLeft)+'px';
  tray.style.height=first.offsetHeight+'px';
  trays.append(tray);
 }
 board.prepend(trays);
}
function render(){const frag=document.createDocumentFragment();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const id=grid[r][c],el=document.createElement('div');el.className='cell';el.dataset.r=r;el.dataset.c=c;if(id!==null){const g=groups.get(id),pos=groupRow(id),offset=c-pos.c,d=g.donuts[offset];el.classList.add('occupied');el.dataset.id=id;if(id%2)el.classList.add('alt');el.classList.add('group-'+(offset===0?'first':offset===g.len-1?'last':'middle'));if(g.len===1)el.classList.add('group-single');el.style.setProperty('--group-color', ['#D99AAE','#E7BAC9','#D49AA6','#E4B7AF','#E1B7B9','#DDA7B8','#E8BDB1','#F0BFC9','#D1A2A9'][d.type]);if(d.special)el.classList.add('special');const img=new Image();img.src=art[d.type];img.alt='';img.draggable=false;img.onerror=()=>{img.remove();const t=document.createElement('span');t.className='fallback';t.textContent='🍩';el.append(t)};el.append(img)}if(hover){const len=groups.get(hover.id)?.len||0;if(r===hover.r&&c>=hover.c&&c<hover.c+len)el.classList.add(hover.valid?'ghost':'invalid')}frag.append(el)}board.replaceChildren(frag);buildGroupTrays();requestAnimationFrame(reportFrameHeight);$('score').textContent=String(score).padStart(4,'0');$('lines').textContent=lines;$('countdown').textContent=moves;updateBoosterButtons()}


const drThresholds=[1000,2000,3000,6000,8000,10000,12000,14000,16000,20000,22000,24000,26000,28000,30000];
const drRewards=[['diamonds',50],['diamonds',50],['diamonds',50],['diamonds',50],['diamonds',50],['diamonds',50],['splitter',1],['diamonds',50],['diamonds',50],['diamonds',50],['evictor',1],['diamonds',100],['splitter',1],['diamonds',100],['diamonds',100]];
const drRankRewards=['2,000 Diamonds · 2 Splitters · 2 Evictors','1,500 Diamonds · 2 Splitters · 1 Evictor','1,000 Diamonds · 1 Splitter · 1 Evictor','700 Diamonds · 1 Evictor','500 Diamonds · 1 Splitter','200 Diamonds each'];
let drLive=false,drRunSeq=0,drRunId=null,drOverStats=null,drModalView=null,drMilestoneState=null;
const drEsc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const drFmt=v=>Number(v||0).toLocaleString();
function drBeginRun(){drRunSeq++;drRunId=null;drOverStats=null;drSignal({type:'nw-dr-start',seq:drRunSeq})}
function drFinishRun(){drOverStats={score,lines,moves};drSendFinished()}
function drSendFinished(){if(!drRunId||!drOverStats)return;const stats=drOverStats;drOverStats=null;drSignal({type:'nw-dr-finish',seq:drRunSeq,runId:drRunId,...stats})}
function drOpenModal(view){
 drModalView=view;$('drEventOverlay').hidden=false;
 $('drEventTitle').textContent=view==='rank'?'LEADERBOARD':view==='rewards'?'RANK REWARDS':'MILESTONES';
 $('drEventBody').innerHTML='<p class="dr-event-note">LOADING…</p>';
 if(view==='rewards')drRenderRewards();
 else drSignal({type:view==='rank'?'nw-dr-rank':'nw-dr-milestones'});
 requestAnimationFrame(reportFrameHeight);
}
function drRenderRewards(){
 $('drEventBody').innerHTML=drRankRewards.map((reward,i)=>'<div class="dr-prize-line"><b>'+(i===5?'#6–10':'#'+(i+1))+'</b><span>'+reward+'</span></div>').join('');
}
function drRenderRank(rows,state){
 if(drModalView!=='rank')return;
 const body=$('drEventBody'),best=Number(state?.best)||0;
 if(drLive&&best<1000){body.innerHTML='<p class="dr-event-note">Reach 1,000 points in one run to unlock the leaderboard.</p><button class="dr-event-action" data-prizes>VIEW REWARDS</button>';body.querySelector('[data-prizes]').onclick=()=>drOpenModal('rewards');return}
 const all=Array.isArray(rows)?rows:[];
 body.innerHTML='<p class="dr-event-note">'+(drLive?'FRIDAY–SUNDAY · HIGHEST SINGLE-RUN SCORE':'PRACTICE MODE · LAST EVENT RESULTS')+'</p><button class="dr-event-action" data-prizes>VIEW REWARDS</button>'+
 (all.length?all.map(r=>{
  const avatar=/^[a-z0-9_/-]+\.png$/i.test(r.avatar||'')?'../'+r.avatar:'../growing/assets/01_gloop.png';
  const frame=/^(usual|weird|monthly-(10|25|50|100|150|200))$/.test(r.frame||'')?r.frame:'usual';
  const frameUrl=frame==='usual'?'../frames/nw-free-usual.png?v=42':frame==='weird'?'../frames/nw-free-weird.png?v=42':'../frames/nw-'+frame+'.png';
  return '<div class="dr-rank-line'+(r.is_me?' is-me':'')+'"><span class="dr-rank-place">#'+Number(r.place)+'</span><span class="dr-rank-avatar"><img src="'+drEsc(avatar)+'" alt=""><img src="'+drEsc(frameUrl)+'" alt=""></span><span class="dr-rank-name">'+drEsc(r.username)+(r.is_me?' (YOU)':'')+'</span><span class="dr-rank-score">'+drFmt(r.score)+'</span></div>';
 }).join(''):'<p class="dr-event-note">No leaderboard entries yet.</p>');
 body.querySelector('[data-prizes]').onclick=()=>drOpenModal('rewards');
}
function drRenderMilestones(state){
 if(drModalView!=='milestones')return;
 drMilestoneState=state||drMilestoneState||{};
 const best=Number(drMilestoneState.best)||0,claimed=new Set((drMilestoneState.claimed||[]).map(Number));
 $('drEventBody').innerHTML='<p class="dr-event-note">BEST RUN: '+drFmt(best)+' · '+(drLive?'EVENT LIVE':'PREVIOUS EVENT REWARDS')+'</p>'+
 drThresholds.map((threshold,i)=>{
  const done=claimed.has(i+1),ready=best>=threshold;
  const [kind,qty]=drRewards[i],name=kind==='diamonds'?'Diamonds':kind==='splitter'?'Sugar Splitter':'Donut Evictor';
  return '<div class="dr-milestone-line"><span class="dr-milestone-tier">#'+(i+1)+'</span><span class="dr-milestone-content"><strong>'+drFmt(threshold)+' POINTS</strong><small>'+qty+' × '+name+'</small></span><button data-dr-claim="'+(i+1)+'" '+(!ready||done?'disabled':'')+'>'+(done?'CLAIMED':ready?'CLAIM':'LOCKED')+'</button></div>';
 }).join('');
 $('drEventBody').querySelectorAll('[data-dr-claim]:not(:disabled)').forEach(btn=>btn.onclick=()=>{btn.disabled=true;btn.textContent='CLAIMING…';drSignal({type:'nw-dr-claim',tier:Number(btn.dataset.drClaim)})});
}
function drCloseModal(){drModalView=null;$('drEventOverlay').hidden=true;requestAnimationFrame(reportFrameHeight)}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.parent)return;
 const data=event.data||{};
 if(data.type==='nw-dr-session'&&data.seq===drRunSeq){drRunId=data.run_id||null;drSendFinished()}
 else if(data.type==='nw-dr-finished'&&data.seq===drRunSeq){drMilestoneState=data.state;if(data.result?.rank_unlocked)announce('Your best run was recorded!')}
 else if(data.type==='nw-dr-rank-data')drRenderRank(data.rows,data.state);
 else if(data.type==='nw-dr-milestone-data')drRenderMilestones(data.state);
 else if(data.type==='nw-dr-milestone-claimed'){drMilestoneState=data.state;drRenderMilestones(data.state);drSignal({type:'nw-dr-ready'})}
 else if(data.type==='nw-dr-event-error'){
  if(data.command==='nw-dr-start'&&data.seq===drRunSeq){drRunId=null;drOverStats=null}
  if(['nw-dr-rank','nw-dr-milestones','nw-dr-claim'].includes(data.command)&&drModalView){
   const el=$('drEventBody');if(el)el.insertAdjacentHTML('afterbegin','<p class="dr-event-note">'+drEsc(data.message||'Could not load event data')+'</p>');
  }
  if(data.command==='nw-dr-finish')announce('Could not save event score: '+(data.message||'Unknown error'));
 }
});

/* Parent-owned cloud Inventory bridge. No booster stock is stored locally here. */
let drBalances={splitter:0,evictor:0},drLoaded=false,activeBooster=null,drRequest=0,drPending=null;
function drSignal(message){if(window.parent!==window)window.parent.postMessage(message,location.origin)}
function updateBoosterButtons(){
 for(const kind of ['splitter','evictor']){
  const btn=$(kind==='splitter'?'drSplitter':'drEvictor');
  if(!btn)return;
  const active=activeBooster===kind;
  btn.classList.toggle('is-active',active);
  btn.setAttribute('aria-pressed',String(active));
  btn.disabled=busy||!running||!drLoaded||drBalances[kind]<=0;
  btn.querySelector('.dr-count b').textContent=drLoaded?drBalances[kind]:'…';
 }
 board.classList.toggle('dr-target-splitter',activeBooster==='splitter');
 board.classList.toggle('dr-target-evictor',activeBooster==='evictor');
}
function cancelBooster(){activeBooster=null;updateBoosterButtons()}
function toggleBooster(kind){
 if(busy||!running||!drLoaded)return;
 if(activeBooster===kind){cancelBooster();announce('Booster cancelled.');return}
 if(!drBalances[kind]){announce('No '+(kind==='splitter'?'Sugar Splitters':'Donut Evictors')+' left in Inventory.');return}
 activeBooster=kind;hover=null;drag=null;
 updateBoosterButtons();announce(kind==='splitter'?'Tap a connected block of 2–4 donuts to split it.':'Tap any donut to evict every donut of its type.');
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.parent)return;
 const data=event.data||{};
 if(data.type==='nw-dr-state'){
  drLive=!!data.live;$('drEventStatus').textContent=drLive?'EVENT LIVE · FRI–SUN':'PRACTICE MODE · EVENT RETURNS FRIDAY';
  drLoaded=true;drBalances={splitter:Math.max(0,Number(data.splitter)||0),evictor:Math.max(0,Number(data.evictor)||0)};
  updateBoosterButtons();
  if(data.awarded){$('drWelcome').hidden=false;requestAnimationFrame(reportFrameHeight)}
 }else if(['nw-dr-spent','nw-dr-error'].includes(data.type)){
  if(data.type==='nw-dr-spent'){
   drBalances={splitter:Math.max(0,Number(data.splitter)||0),evictor:Math.max(0,Number(data.evictor)||0)};
   updateBoosterButtons();
  }
  if(drPending&&data.requestId===drPending.id){
   const pending=drPending;drPending=null;
   if(data.type==='nw-dr-spent')pending.resolve();else pending.reject(Error(data.message||'Booster unavailable.'));
  }else if(data.type==='nw-dr-error'&&!data.requestId){announce(data.message||'Could not sync booster Inventory.')}
 }
});
function drSpend(kind){
 return new Promise((resolve,reject)=>{
  if(drPending){reject(Error('Another booster is still syncing.'));return}
  if(window.parent===window){reject(Error('Open Donut Rise from Nine & Weird to use Inventory boosters.'));return}
  const id=++drRequest;
  drPending={id,resolve,reject};
  drSignal({type:'nw-dr-spend',requestId:id,item:'dr_'+kind});
 });
}
function drSplitGroup(id){
 const p=groupRow(id),group=groups.get(id);
 if(!p||!group||group.len<2||group.len>4)return false;
 for(let k=0;k<group.len;k++){
  const single=nextId++;
  groups.set(single,{len:1,donuts:[{...group.donuts[k]}]});
  grid[p.r][p.c+k]=single;
 }
 groups.delete(id);return true;
}
function drEvictType(type){
 let removed=0;
 // Each surviving horizontal segment gets its own group so gravity stays valid.
 for(const [id,group] of [...groups]){
  const p=groupRow(id);if(!p)continue;
  const original=group.donuts.map(d=>({...d}));
  if(!original.some(d=>d.type===type))continue;
  for(let k=0;k<original.length;k++){grid[p.r][p.c+k]=null;if(original[k].type===type)removed++}
  groups.delete(id);
  let k=0;
  while(k<original.length){
   if(original[k].type===type){k++;continue}
   const start=k,segment=[];
   while(k<original.length&&original[k].type!==type)segment.push(original[k++]);
   const replacement=nextId++;
   groups.set(replacement,{len:segment.length,donuts:segment});
   for(let j=0;j<segment.length;j++)grid[p.r][p.c+start+j]=replacement;
  }
 }
 return removed;
}
async function drUseBooster(r,c){
 const kind=activeBooster;
 if(!kind||busy||!running||grid[r][c]===null)return;
 const id=grid[r][c],group=groups.get(id),pos=groupRow(id);
 if(!group||!pos)return;
 if(kind==='splitter'&&(group.len<2||group.len>4)){announce('Choose a connected block of 2–4 donuts.');return}
 const selectedType=group.donuts[c-pos.c]?.type;
 if(kind==='evictor'&&!Number.isInteger(selectedType))return;
 busy=true;cancelBooster();wrap.classList.add('is-resolving');updateBoosterButtons();
 try{
  await drSpend(kind);
  // The board cannot change while waiting for an atomic cloud deduction.
  if(kind==='splitter')drSplitGroup(id);
  else drEvictType(selectedType);
  const button=$(kind==='splitter'?'drSplitter':'drEvictor');
  button.classList.add('is-animating');setTimeout(()=>button.classList.remove('is-animating'),600);
  render();await resolveBoard(); // Normal completed rows earn their normal score.
  announce(kind==='splitter'?'SUGAR SPLITTER! Pieces set free.':'DONUT EVICTOR! All matching donuts cleared.');
  // Deliberately no rise(), no replenishEmptyBoard() and no moves++.
 }catch(error){announce(error.message||'Booster could not be used. Your board is unchanged.')}
 finally{busy=false;wrap.classList.remove('is-resolving');render()}
}

// Keep interaction purely drag-to-move. Prevent native text/image selection and
// release pointer state cleanly on cancel/lost capture.
board.addEventListener('dragstart',e=>e.preventDefault());
board.addEventListener('selectstart',e=>e.preventDefault());
board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('pointerdown',e=>{
 if(!running||paused||busy||e.button!==0||drag)return;
 const pos=locAtPoint(e.clientX,e.clientY);if(!pos)return;
 const id=grid[pos.r][pos.c];if(id===null)return;
 e.preventDefault();
 if(activeBooster){void drUseBooster(pos.r,pos.c);return;}
 const start=groupRow(id);if(!start)return;
 selected=null;hover=null;
 drag={id,pointerId:e.pointerId,offset:pos.c-start.c,sx:e.clientX,sy:e.clientY,moved:false};
 wrap.classList.add('dragging');
 try{board.setPointerCapture(e.pointerId)}catch{}
});
function dragTarget(e){
 if(!drag||drag.pointerId!==e.pointerId)return null;
 const pos=groupRow(drag.id);if(!pos)return null;
 const sample=board.querySelector('.cell');if(!sample)return null;
 const style=getComputedStyle(board),step=sample.getBoundingClientRect().width+(parseFloat(style.columnGap)||0);
 const delta=Math.round((e.clientX-drag.sx)/Math.max(1,step));
 return {r:pos.r,c:Math.max(0,Math.min(COLS-groups.get(drag.id).len,pos.c+delta))};
}
function clearDragState(){
 drag=null;hover=null;selected=null;wrap.classList.remove('dragging');
}
board.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId||!running||paused||busy)return;
 e.preventDefault();
 const target=dragTarget(e);if(!target)return;
 if(Math.abs(e.clientX-drag.sx)>7)drag.moved=true;
 if(drag.moved){
  const valid=canMove(drag.id,target.r,target.c);
  if(!hover||hover.c!==target.c||hover.valid!==valid){hover={...target,id:drag.id,valid};render()}
 }
});
board.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 e.preventDefault();
 const id=drag.id,target=dragTarget(e),moved=drag.moved;
 clearDragState();
 try{if(board.hasPointerCapture(e.pointerId))board.releasePointerCapture(e.pointerId)}catch{}
 if(moved&&target){
  if(!canMove(id,target.r,target.c))announce('That space is occupied. Slide into another gap.');
  else {void move(id,target.r,target.c);return;}
 }
 if(!busy)render();
});
board.addEventListener('pointercancel',e=>{if(drag?.pointerId===e.pointerId){clearDragState();if(!busy)render()}});
board.addEventListener('lostpointercapture',e=>{if(drag?.pointerId===e.pointerId){clearDragState();if(!busy)render()}});
function end(){running=false;drFinishRun();$('overlay').hidden=false;$('overlaytitle').textContent='GAME OVER!';$('overlaytext').textContent='The donuts reached the top. Final score: '+score+' · Lines cleared: '+lines+' · Moves: '+moves;render()}
function reset(){
 if(busy)return;
 grid=empty();groups=new Map();nextId=1;score=0;lines=0;moves=0;running=true;paused=false;selected=null;drag=null;hover=null;
 initial();settleGroups();$('overlay').hidden=true;announce('Slide a group sideways; every valid move adds a new row!');render();
}
// Separate lightweight overlay for the four-button header.
const infoOverlay=$('infooverlay');
function closeInfo(){infoOverlay.hidden=true}
function showInfo(title,body){
 $('infotitle').textContent=title;
 $('infobody').replaceChildren();
 const lines=Array.isArray(body)?body:[body];
 for(const line of lines){const p=document.createElement('p');p.textContent=line;$('infobody').append(p)}
 infoOverlay.hidden=false;
 $('infoclose').focus();
}
function buildLandingDonuts(){
 const top=$('drDonutRowTop'),bottom=$('drDonutRowBottom');
 top.replaceChildren();bottom.replaceChildren();
 art.forEach((src,i)=>{
  const holder=document.createElement('div');
  holder.className='dr-donut-card';holder.style.setProperty('--i',i);
  const img=new Image();img.src=src;img.alt='';img.draggable=false;
  img.onerror=()=>{img.remove();const fallback=document.createElement('span');fallback.textContent='🍩';fallback.setAttribute('aria-hidden','true');holder.append(fallback)};
  holder.append(img);(i<4?top:bottom).append(holder);
 });
}
function showLanding(){
 cancelBooster();landing.hidden=false;gameShell.hidden=true;
 requestAnimationFrame(reportFrameHeight);
}
function startGameplay(){
 cancelBooster();landing.hidden=true;gameShell.hidden=false;
 reset();drBeginRun();
 requestAnimationFrame(reportFrameHeight);
}
$('drStartButton').onclick=startGameplay;
$('drLandingHelp').onclick=showHowToPlay;
$('drPlayHelp').onclick=showHowToPlay;
$('drLandingRank').onclick=()=>drOpenModal('rank');
$('drMilestonesOpen').onclick=()=>drOpenModal('milestones');
$('drEventClose').onclick=drCloseModal;
$('drSplitter').onclick=()=>toggleBooster('splitter');
$('drEvictor').onclick=()=>toggleBooster('evictor');
$('drWelcomeClose').onclick=()=>{$('drWelcome').hidden=true};
$('again').onclick=()=>{reset();drBeginRun();requestAnimationFrame(reportFrameHeight)};
$('leaveGame').onclick=()=>{cancelBooster();$('overlay').hidden=true;showLanding()};
function showHowToPlay(){showInfo('HOW TO PLAY',[
 'Slide the donut blocks left or right.',
 'Fill a row to clear it.',
 'Blocks drop automatically.',
 'A new row rises after every move.',
 'Donuts come in blocks of 1, 2, 3 or 4.',
 'Sugar Splitter separates a connected block of 2–4 donuts.',
 'Donut Evictor removes all donuts of one selected type.',
 'Boosters do not raise a row or use a move. Any completed rows still score.'
]);}
$('infoclose').onclick=closeInfo;
infoOverlay.addEventListener('click',e=>{if(e.target===infoOverlay)closeInfo()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!infoOverlay.hidden)closeInfo()});
if(typeof ResizeObserver!=='undefined'){
 const frameObserver=new ResizeObserver(reportFrameHeight);
 frameObserver.observe(document.querySelector('.app'));
}
window.addEventListener('load',reportFrameHeight);
document.fonts?.ready?.then(reportFrameHeight);
document.addEventListener('dragstart',e=>{if(e.target.closest('.app'))e.preventDefault()});
buildLandingDonuts();
showLanding();
drSignal({type:'nw-dr-ready'});
})();
